name: Wine Notes
options:
  bundleIdPrefix: com.shimondeitel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: W7Q885Q59C
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  WineNotes:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WineNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.winelog
        DEVELOPMENT_TEAM: W7Q885Q59C
        MARKETING_VERSION: "1.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: WineNotes/Info.plist
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: WineNotes/Info.plist
      properties:
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
  WineNotesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WineNotesTests
    dependencies:
      - target: WineNotes
    settings:
      base:
        DEVELOPMENT_TEAM: W7Q885Q59C
  WineNotesUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WineNotesUITests
    dependencies:
      - target: WineNotes
    settings:
      base:
        DEVELOPMENT_TEAM: W7Q885Q59C
schemes:
  WineNotes:
    build:
      targets:
        WineNotes: all
    test:
      targets:
        - WineNotesTests
        - WineNotesUITests
    run:
      config: Debug
